apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a3-traces
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector: {app: api, validation: cache-invalidation}
  ports:
    - {name: http, port: 80, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Adopt the existing isolated cache-proof deployment and keep its original selector.
  name: a3-cache-api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: api, validation: cache-invalidation}
  template:
    metadata:
      labels: {app: api, validation: cache-invalidation}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: rahbar-api:a3
          imagePullPolicy: Never
          command: [uvicorn]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-graceful-shutdown", "20"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CACHE_BACKEND, value: memory}
            - {name: LLM_PROVIDER, value: hosted}
            - {name: HOSTED_BASE_URL, value: "https://api.groq.com/openai/v1"}
            - {name: HOSTED_JSON_MODE, value: json_schema}
            - {name: LLM_MODEL, value: openai/gpt-oss-20b}
            - {name: TRACE_STDOUT, value: "true"}
            - {name: TRACE_DIR, value: /data/traces}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: rahbar-a3-hosted, key: LLM_API_KEY}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: traces, mountPath: /data/traces}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: traces
          persistentVolumeClaim: {claimName: a3-traces}
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a3-cache-api-egress
spec:
  podSelector:
    matchLabels: {app: api, validation: cache-invalidation}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
