# Seed the verified public index separately using the saved embeddings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../dev
patches:
  - target: {kind: Job, name: indexer}
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: indexer
  - target: {kind: CronJob, name: reindex}
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: reindex
      spec:
        suspend: true
