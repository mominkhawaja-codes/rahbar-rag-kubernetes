$patch: delete
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a3-traces
  namespace: rahbar-a3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rahbar-a3
spec:
  selector: {app: api, validation: part-c-candidate}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-cache-api
  namespace: rahbar-a3
spec:
  # Set to one only after the separate collection and evaluator gate are ready.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api, validation: part-c-candidate}
  template:
    metadata:
      labels: {app: api, validation: part-c-candidate}
    spec:
      containers:
        - name: api
          env:
            - {name: CHROMA_COLLECTION, value: rahbar-a3-candidate}
            - {name: TRACE_DIR, value: ""}
          volumeMounts:
            - mountPath: /data/traces
              $patch: delete
      volumes:
        - name: traces
          $patch: delete
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a3-cache-api-egress
  namespace: rahbar-a3
spec:
  podSelector:
    matchLabels: {app: api, validation: part-c-candidate}
