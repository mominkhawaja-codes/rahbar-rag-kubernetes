# One ServiceAccount per workload, so each has its own identity (section 4.7). None of
# these workloads calls the Kubernetes API, so no Role or RoleBinding exists for any of
# them, and no token is mounted: automountServiceAccountToken is false here and again on
# every pod spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-api
  namespace: rahbar
  labels: {app: api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-ui
  namespace: rahbar
  labels: {app: ui}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-chroma
  namespace: rahbar
  labels: {app: chroma}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-redis
  namespace: rahbar
  labels: {app: redis}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-indexer          # the indexer Job and the reindex CronJob
  namespace: rahbar
  labels: {app: indexer}
automountServiceAccountToken: false
