# Documents the Secret's shape only. NEVER list this file in kustomization.yaml:
# applying it would overwrite the real key. Create the real one with:
#   export LLM_API_KEY=...   then   make secret
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
