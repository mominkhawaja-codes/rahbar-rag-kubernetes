# Deny by default, then allow exactly the paths the system uses (handout section 4.7):
#   ingress-nginx -> ui:8080, api:8000      api -> chroma:8000, redis:6379, LLM
#   indexer -> chroma:8000, Ollama           every pod -> CoreDNS:53
# There is no ui -> api pod rule on purpose: the ui is static files, and the browser calls
# /api through the Ingress (allowed above). No ui pod ever opens a connection to an api pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:                       # CoreDNS only, not every pod in kube-system
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-ui
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: ui}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-api
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - podSelector: {matchLabels: {app: redis}}
      ports: [{protocol: TCP, port: 6379}]
    - to:                       # Ollama on the host, or a hosted LLM over HTTPS
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: indexer-egress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: indexer}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 11434}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chroma-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: chroma}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [api, indexer]}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
      ports: [{protocol: TCP, port: 6379}]
