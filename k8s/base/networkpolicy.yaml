# Deny by default, then allow exactly the arrows in the architecture diagram:
#   ingress-nginx -> ui, api      api -> chroma, redis, LLM      indexer -> chroma, Ollama
# Every pod may resolve DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-ui-and-api
  namespace: rahbar
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [ui, api]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - podSelector: {matchLabels: {app: redis}}
      ports: [{protocol: TCP, port: 6379}]
    - to:                       # Ollama on the host, or a hosted LLM over HTTPS
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: indexer-egress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: indexer}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 11434}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chroma-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: chroma}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [api, indexer]}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
      ports: [{protocol: TCP, port: 6379}]
