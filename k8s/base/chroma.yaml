# The vector store: a StatefulSet with its own PersistentVolumeClaim, so the index
# survives pod restarts. ClusterIP only: nothing outside the cluster talks to Chroma.
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
  labels: {app: chroma}
spec:
  type: ClusterIP
  selector: {app: chroma}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-headless
  namespace: rahbar
  labels: {app: chroma}
spec:
  clusterIP: None
  selector: {app: chroma}
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels: {app: chroma}
spec:
  serviceName: chroma-headless
  replicas: 1
  selector:
    matchLabels: {app: chroma}
  template:
    metadata:
      labels: {app: chroma}
    spec:
      serviceAccountName: rahbar-chroma
      automountServiceAccountToken: false
      # Without this, Kubernetes injects CHROMA_PORT=tcp://<ip>:8000 for the "chroma" Service,
      # and Chroma 1.x reads every CHROMA_* variable as config: it panics ("expected u16 for
      # key PORT") and crash-loops. Our pods find services by DNS, never by these variables.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12          # same version as chromadb-client
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: /data
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
