# Semantic-cache threshold experiment (ADR 0003): real nomic-embed-text embeddings and a
# real Redis. Runs when the experiment changes, or by hand.
name: cache-threshold

on:
  push:
    branches: [dev]
    paths:
      - eval/cache_pairs.yaml
      - eval/cache_threshold.py
      - .github/workflows/cache-threshold.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.8.4-alpine3.23@sha256:c027ae0f677dcf73d74038256f5b88c9ba7b11ccbfae97e96a9f091208d36125
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt pyyaml==6.0.2
      - name: start Ollama and pull the pinned embedding model
        run: |
          docker run -d --name ollama -p 11434:11434 \
            ollama/ollama:0.5.7@sha256:7e672211886f8bd4448a98ed577e26c816b9e8b052112860564afaa2c105800e
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          docker exec ollama ollama pull nomic-embed-text
      - name: measure
        env:
          OLLAMA_URL: http://localhost:11434
          REDIS_URL: redis://localhost:6379/0
        run: python eval/cache_threshold.py --out cache-threshold.json
      - name: publish the measurements as annotations
        if: always()
        run: |
          [ -f cache-threshold.json ] || exit 0
          python - <<'EOF'
          import json
          d = json.load(open("cache-threshold.json"))
          table = [[r["threshold"], r["true_hits"], r["false_hits"], r["misses"],
                    r["false_hit_rate"], r["false_hit_ids"]] for r in d["table"]]
          summary = {k: d[k] for k in ("embed_model", "pairs", "chosen_threshold",
                                        "lowest_same_answer_similarity",
                                        "highest_different_answer_similarity", "redis",
                                        "abstention_cached", "followups_cached", "failures")}
          for title, body in (("cache threshold summary", summary),
                              ("cache threshold table [t, true, false, miss, fhr, ids]", table),
                              ("cache pair similarities", d["similarities"])):
              text = json.dumps(body, separators=(",", ":")).replace("%", "%25")
              print(f"::notice title={title}::{text}")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cache-threshold
          path: cache-threshold.json
          if-no-files-found: ignore
