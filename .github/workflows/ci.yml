# CI: every push and pull request to dev and main, and called by cd.yml before publishing.
# Order: lint + unit tests + manifest validation -> build, scan and save each image once
#        -> e2e eval gate on kind, using exactly the images that were scanned.
#
# Every third-party action is pinned to a full commit SHA (the tag is in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: ruff
        run: ruff check api indexer eval corpus
      - name: mypy
        run: |
          (cd api && mypy app)
          (cd indexer && mypy pipeline)

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: pytest with coverage (stubs only, no network, no model; fails below 60%)
        run: |
          (cd api && pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60)
          (cd indexer && pytest -q --cov=pipeline --cov-report=term-missing --cov-fail-under=60)
          pytest -q eval/tests
      - name: submission checker (reported, not gated)
        run: python scripts/check_submission.py || true

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install kubeconform v0.6.7 (checksum verified)
        run: |
          curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          sudo tar xzf kubeconform-linux-amd64.tar.gz -C /usr/local/bin kubeconform
      - name: kubeconform every overlay
        run: |
          for overlay in dev prod ci; do
            echo "== $overlay"
            kubectl kustomize "k8s/overlays/$overlay" \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done

  images:
    needs: [lint, test, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false            # one image's findings must not hide the others' results
      matrix:
        component: [api, indexer, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: stage the fixture corpus into the indexer build context
        if: matrix.component == 'indexer'
        run: |
          mkdir -p indexer/corpus indexer/fixtures
          cp eval/fixtures/*.md indexer/fixtures/ && rm -f indexer/fixtures/README.md
      - name: build
        run: docker build --pull -t rahbar-${{ matrix.component }}:ci ${{ matrix.component }}
      - name: trivy report (all severities with a fix, for the log)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rahbar-${{ matrix.component }}:ci
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: trivy gate (fails on any fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rahbar-${{ matrix.component }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true
      - name: save the scanned image for the e2e job
        run: docker save rahbar-${{ matrix.component }}:ci | gzip > image-${{ matrix.component }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e-eval:
    # The whole system on an ephemeral kind cluster: index the fixture corpus with the
    # indexer Job, then score eval/fixtures/golden.fixture.yaml through the API and gate.
    needs: [images]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1 pyyaml==6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: rahbar
      - name: load the scanned images into kind
        run: |
          for c in api indexer ui; do
            gunzip -c image-$c.tar.gz | docker load
            kind load docker-image rahbar-$c:ci --name rahbar
          done
      - name: apply the ci overlay
        run: |
          kubectl apply -k k8s/overlays/ci
          kubectl -n rahbar rollout status statefulset/chroma --timeout=300s
          kubectl -n rahbar rollout status deployment/ollama --timeout=300s
          kubectl -n rahbar rollout status deployment/redis --timeout=180s
      - name: pull the embedding model
        run: kubectl -n rahbar exec deploy/ollama -- ollama pull nomic-embed-text
      - name: run the indexer Job on the fixture corpus
        run: |
          kubectl -n rahbar create job --from=cronjob/reindex reindex-ci
          kubectl -n rahbar wait --for=condition=complete job/reindex-ci --timeout=600s
          kubectl -n rahbar logs job/reindex-ci --tail=20
      - name: wait for the api to become ready
        run: kubectl -n rahbar rollout status deployment/api --timeout=300s
      - name: eval gate
        run: |
          kubectl -n rahbar port-forward svc/api 8000:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/readyz >/dev/null && break; sleep 2; done
          python eval/run_eval.py --api http://localhost:8000 \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.json \
            --out eval-fixture-results.json
      - name: verify Redis persistence across a pod replacement
        run: |
          set -euo pipefail
          r() { kubectl -n rahbar exec "$1" -- redis-cli "${@:2}"; }
          phase="$(kubectl -n rahbar get pvc cache-data -o jsonpath='{.status.phase}')"
          echo "pvc cache-data: $phase"; [ "$phase" = "Bound" ]
          pod="$(kubectl -n rahbar get pod -l app=redis -o jsonpath='{.items[0].metadata.name}')"
          key="ci-persist-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; val="v-$(date +%s%N)"
          [ "$(r "$pod" SET "$key" "$val")" = "OK" ]
          # A SET reply only proves memory. Rewrite the AOF (written and fsynced to the
          # volume by Redis) and wait until it has finished with status ok.
          r "$pod" BGREWRITEAOF
          for i in $(seq 1 30); do
            info="$(r "$pod" INFO persistence | tr -d '\r')"
            echo "$info" | grep -q '^aof_rewrite_in_progress:0' \
              && echo "$info" | grep -q '^aof_rewrite_scheduled:0' && break
            sleep 1
          done
          echo "$info" | grep -E '^(aof_enabled|aof_rewrite_in_progress|aof_last_bgrewrite_status|aof_last_write_status):'
          echo "$info" | grep -qx 'aof_last_bgrewrite_status:ok'
          echo "$info" | grep -qx 'aof_last_write_status:ok'
          kubectl -n rahbar exec "$pod" -- ls -ln /data/appendonlydir
          kubectl -n rahbar exec "$pod" -- sh -c 'ls /data/appendonlydir | grep -q "\.manifest$"'
          # No grace period: Redis gets no chance to flush on shutdown, so only what is
          # already on the volume can survive.
          kubectl -n rahbar delete pod "$pod" --grace-period=0 --force --wait=true
          kubectl -n rahbar rollout status deployment/redis --timeout=180s
          kubectl -n rahbar wait --for=condition=Ready pod -l app=redis --timeout=120s
          new="$(kubectl -n rahbar get pod -l app=redis -o jsonpath='{.items[0].metadata.name}')"
          echo "replaced $pod with $new"; [ "$new" != "$pod" ]
          got="$(r "$new" GET "$key")"
          echo "after replacement: $key=$got"; [ "$got" = "$val" ]
          echo "::notice title=redis persistence verified::pvc=$phase; $pod -> $new; $key survived a forced pod deletion"
      - name: probe NetworkPolicy paths (allowed must work; denied is reported)
        run: |
          set -uo pipefail
          api="$(kubectl -n rahbar get pod -l app=api -o jsonpath='{.items[0].metadata.name}')"
          ui="$(kubectl -n rahbar get pod -l app=ui -o jsonpath='{.items[0].metadata.name}')"
          py='import socket,sys; socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=3)'
          ok=1
          for target in chroma:8000 redis:6379; do
            if kubectl -n rahbar exec "$api" -- python -c "$py" "${target%:*}" "${target#*:}"; then
              echo "allowed  api -> $target: connected"
            else
              echo "::error title=networkpolicy::api -> $target should be allowed but failed"; ok=0
            fi
          done
          if kubectl -n rahbar exec "$ui" -- wget -q -T 3 -O /dev/null http://chroma:8000/api/v2/heartbeat; then
            denied="ui -> chroma:8000 CONNECTED: this cluster's CNI is not enforcing NetworkPolicy"
          else
            denied="ui -> chroma:8000 blocked (connection failed, as the policy requires)"
          fi
          echo "$denied"
          echo "::notice title=networkpolicy probe::api -> chroma:8000 and redis:6379 allowed: $([ $ok = 1 ] && echo yes || echo NO); $denied"
          [ "$ok" = 1 ]
      - name: capture cluster evidence (endpoints, hpa, top) as annotations
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
          for i in $(seq 1 24); do kubectl top pods -n rahbar >/dev/null 2>&1 && break; sleep 5; done
          sleep 30   # let the HPA read at least one metrics sample
          note() {
            local title="$1"; shift
            local out; out="$(echo "\$ $*"; "$@" 2>&1 | tail -n 40)"
            out="${out//'%'/'%25'}"; out="${out//$'\r'/}"; out="${out//$'\n'/'%0A'}"
            echo "::notice title=${title}::${out}"
          }
          note "evidence: kubectl get endpoints" kubectl -n rahbar get endpoints -o wide
          note "evidence: kubectl get hpa" kubectl -n rahbar get hpa
          note "evidence: kubectl top pods" kubectl top pods -n rahbar --containers
          note "evidence: kubectl get pods" kubectl -n rahbar get pods -o wide
      - name: publish the fixture results as an annotation
        if: always()
        run: |
          if [ -f eval-fixture-results.json ]; then
            python eval/tools/annotate.py eval-fixture-results.json
          fi
      - name: upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-fixture-results
          path: eval-fixture-results.json
          if-no-files-found: ignore
      - name: diagnostics as annotations (readable without access to the raw logs)
        if: failure()
        run: |
          note() {   # one annotation per diagnostic, newlines encoded for the runner
            local title="$1"; shift
            local out; out="$("$@" 2>&1 | tail -n 40)"
            out="${out//'%'/'%25'}"; out="${out//$'\r'/}"; out="${out//$'\n'/'%0A'}"
            echo "::warning title=${title}::${out}"
          }
          note "pods" kubectl -n rahbar get pods -o wide
          note "events" sh -c "kubectl -n rahbar get events --sort-by=.lastTimestamp | tail -n 30"
          note "chroma-0 logs" kubectl -n rahbar logs chroma-0 --tail=40
          note "chroma-0 describe" sh -c "kubectl -n rahbar describe pod chroma-0 | tail -n 35"
          note "api logs" kubectl -n rahbar logs deploy/api --tail=30
          note "redis pvc and logs" sh -c "kubectl -n rahbar get pvc cache-data -o wide; kubectl -n rahbar logs deploy/redis --tail=25"
          note "indexer logs" kubectl -n rahbar logs job/reindex-ci --all-containers --tail=30
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n rahbar get pods,jobs,endpoints -o wide || true
          kubectl -n rahbar get events --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl -n rahbar describe pods | tail -n 120 || true
          kubectl -n rahbar logs deploy/api --tail=80 || true
          kubectl -n rahbar logs statefulset/chroma --tail=40 || true
          kubectl -n rahbar logs job/reindex-ci --all-containers --tail=80 || true
