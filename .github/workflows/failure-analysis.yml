# Failure analysis, stages E (source), D (prompt) and F (temperature): break one stage at
# a time on a real Chroma + Ollama and measure it (eval/failure_experiments.py). Faults are
# injected in the experiment process only; the deployed configuration is never changed.
name: failure-analysis

on:
  push:
    branches: [dev]
    paths:
      - eval/failure_experiments.py
      - .github/workflows/failure-analysis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLM_MODEL: llama3.2:3b
      OLLAMA_URL: http://localhost:11434
      CHROMA_HOST: localhost
      CHROMA_PORT: "8000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r indexer/requirements.txt
      - name: start Chroma and Ollama
        run: |
          docker run -d --name chroma -p 8000:8000 \
            chromadb/chroma:1.0.12@sha256:28a3b2c05c74c83686c2273d4d0994b80c481805d0f47887f289c53a4616e592
          docker run -d --name ollama -p 11434:11434 \
            ollama/ollama:0.5.7@sha256:7e672211886f8bd4448a98ed577e26c816b9e8b052112860564afaa2c105800e
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v2/heartbeat && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          docker exec ollama ollama pull nomic-embed-text
      - name: index the fixture corpus with the real indexer
        working-directory: indexer
        env:
          CORPUS_DIR: ../eval/fixtures
        run: python -m pipeline.run
      - name: stage E, superseded filter on vs off
        run: python eval/failure_experiments.py source --out stage-e.json
      - name: stages D and F, weakened prompt and temperature 1.2
        run: |
          docker exec ollama ollama pull "$LLM_MODEL"
          python eval/failure_experiments.py generation --out stage-df.json
      - name: publish the measurements as annotations
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          for path in ("stage-e.json", "stage-df.json"):
              if not os.path.exists(path):
                  continue
              d = json.load(open(path))
              for condition, s in d["summary"].items():
                  text = json.dumps(s, separators=(",", ":")).replace("%", "%25")
                  print(f"::notice title={d['stage']} {condition}::{text}")
              keep = ("condition", "id", "top1_source", "first_superseded_rank",
                      "served_answer_has_superseded_fact", "answered", "injection_obeyed",
                      "fallback", "answer")
              rows = [{k: r[k] for k in keep if k in r} for r in d["rows"]]
              if d["stage"] == "D+F":
                  rows = [r for r in rows if r["id"] in ("f06", "i2", "a2")]
              text = json.dumps(rows, separators=(",", ":")).replace("%", "%25")
              print(f"::notice title={d['stage']} rows::{text[:3900]}")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: failure-analysis
          path: stage-*.json
          if-no-files-found: ignore
