# CD: on every push to main (and dev, for SHA-tagged images). Nothing is published unless the full CI pipeline passed
# (`needs: [ci]`), and each image is scanned again, as built here, before it is pushed.
# Images are tagged with the commit SHA, which is also the rollback key.
#
# Repository secrets used:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   a Docker Hub access token, never a password
#   KUBECONFIG                            optional; without it the deploy job is skipped
name: cd

on:
  push:
    branches: [main, dev]   # dev: SHA-tagged images only; :main is pushed from main only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, indexer, ui]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: stage the fixture corpus (the real corpus is never published)
        if: matrix.component == 'indexer'
        run: |
          mkdir -p indexer/corpus indexer/fixtures
          cp eval/fixtures/*.md indexer/fixtures/ && rm -f indexer/fixtures/README.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (loaded locally, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: trivy gate on the image about to be published
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push the scanned image, by commit SHA and as :main
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
            docker push "$IMAGE:main"
          fi

  deploy-kind:
    # Deploy the images just published, pulled back from Docker Hub by commit SHA, to an
    # ephemeral kind cluster, and wait for every rollout: proves the published artifacts
    # run, not just that they built.
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: rahbar
          config: .github/kind/ingress-cluster.yaml     # maps runner port 80 to the node
      - name: install ingress-nginx (controller-v1.15.1, checksum verified)
        run: |
          curl -sfL -o ingress-nginx.yaml \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          echo "2a3ae008c8786431115502644e77ab398fdebfb721a5d1195ed3089cde3299df  ingress-nginx.yaml" | sha256sum -c -
          kubectl apply -f ingress-nginx.yaml
          kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=180s
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=300s
      - name: point the ci overlay at the published images
        working-directory: k8s/overlays/ci
        run: |
          for c in api indexer ui; do
            kustomize edit set image "rahbar-$c=docker.io/$DOCKERHUB_USER/rahbar-$c:${GITHUB_SHA}"
          done
          kubectl kustomize . | grep -E "image: .*rahbar-"
      - name: deploy and wait for every rollout
        run: |
          kubectl apply -k k8s/overlays/ci
          kubectl -n rahbar rollout status statefulset/chroma --timeout=300s
          kubectl -n rahbar rollout status deployment/redis --timeout=180s
          kubectl -n rahbar rollout status deployment/ollama --timeout=300s
          kubectl -n rahbar exec deploy/ollama -- ollama pull nomic-embed-text
          kubectl -n rahbar create job --from=cronjob/reindex reindex-cd
          kubectl -n rahbar wait --for=condition=complete job/reindex-cd --timeout=600s
          kubectl -n rahbar rollout status deployment/api --timeout=300s
          kubectl -n rahbar rollout status deployment/ui --timeout=180s
          kubectl -n rahbar get pods,svc,endpoints,hpa -o wide
      - name: smoke test through the Ingress (/ and /api/ask on Host rahbar.local)
        run: |
          kubectl -n rahbar get ingress rahbar -o wide
          python3 .github/kind/smoke_ingress.py
      - name: prove the requests went through ingress-nginx
        run: |
          set -euo pipefail
          logs="$(kubectl -n ingress-nginx logs deploy/ingress-nginx-controller --tail=200)"
          api="$(echo "$logs" | grep '"POST /api/ask' | grep 'rahbar-api-80' | tail -n 1)"
          ui="$(echo "$logs" | grep '"GET / ' | grep 'rahbar-ui-80' | tail -n 1)"
          echo "api: $api"; echo "ui: $ui"
          [ -n "$api" ] && [ -n "$ui" ]
          api="${api//'%'/'%25'}"; ui="${ui//'%'/'%25'}"
          echo "::notice title=ingress access log (api)::${api}"
          echo "::notice title=ingress access log (ui)::${ui}"
      - name: diagnostics as annotations
        if: failure()
        run: |
          note() {
            local title="$1"; shift
            local out; out="$("$@" 2>&1 | tail -n 40)"
            out="${out//'%'/'%25'}"; out="${out//$'\r'/}"; out="${out//$'\n'/'%0A'}"
            echo "::warning title=${title}::${out}"
          }
          note "pods" kubectl -n rahbar get pods -o wide
          note "events" sh -c "kubectl -n rahbar get events --sort-by=.lastTimestamp | tail -n 30"
          note "ingress" sh -c "kubectl -n rahbar describe ingress rahbar | tail -n 20"
          note "ingress-nginx logs" kubectl -n ingress-nginx logs deploy/ingress-nginx-controller --tail=30

  deploy:
    # A real cluster, only when a KUBECONFIG secret exists (skipped otherwise).
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: skip when no cluster is configured
        if: env.KUBECONFIG_DATA == ''
        run: echo "No KUBECONFIG secret; images are published, deploy skipped."
      - name: deploy the prod overlay at this commit
        if: env.KUBECONFIG_DATA != ''
        run: |
          mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          cd k8s/overlays/prod
          for c in api indexer ui; do
            kustomize edit set image "rahbar-$c=docker.io/$DOCKERHUB_USER/rahbar-$c:${GITHUB_SHA}"
          done
          kubectl apply -k .
          kubectl -n rahbar rollout status deployment/api --timeout=300s
          kubectl -n rahbar rollout status deployment/ui --timeout=180s
